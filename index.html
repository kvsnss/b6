<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Medical Data Transmission</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
    <h1>Secure Medical Data Transmission</h1>
    <p class="subtitle">
        AES-256 | DWT | ROI | RDH
    </p>
    <form action="/encrypt" method="POST" enctype="multipart/form-data">

        <label>Patient Name</label>
        <input type="text" name="name" placeholder="Enter Patient Name" required>

        <label>Age</label>
        <input type="number" name="age" placeholder="Enter Age" required>

        <label>Gender</label>
        <select name="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>Blood Group</label>
        <select name="blood" required>
            <option value="">Select Blood Group</option>
            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>
        </select>

        <label>Disease</label>
        <input type="text" name="disease" placeholder="Enter Disease" required>

        <label>Doctor Name</label>
        <input type="text" name="doctor" placeholder="Enter Doctor Name" required>

        <label>Hospital Name</label>
        <input type="text" name="hospital" placeholder="Enter Hospital Name" required>

        <label>Create Password</label>
        <input type="password" name="password" placeholder="Create Password" required>

        <label>Upload CT Scan / MRI / X-Ray</label>
        <input type="file"
               name="medical_image"
               accept=".png,.jpg,.jpeg,.bmp,.tif"
               required>

        <button type="Submit">
            Encrypt & Embed
        </button>

    </form>

</div>

</body>
</html>
